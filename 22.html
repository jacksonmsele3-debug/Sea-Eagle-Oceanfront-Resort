<!DOCTYPE html><html lang="sw"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tropicana Oasis – Mockup ya Menyu A5</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--tx:#f6efe6;--mut:#b9a998;--acc:#f3ea0b;--chip:rgba(255,255,255,.07);--chipb:rgba(255,255,255,.22)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--tx:#f6efe6}}
:root[data-theme="dark"]{--tx:#f6efe6}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;color:var(--tx);font-family:Georgia,"Times New Roman",serif;text-align:center;padding:34px 16px 48px;overflow-x:hidden;
background:radial-gradient(ellipse 80% 55% at 50% 38%,rgba(255,196,120,.22),transparent 70%),
repeating-linear-gradient(92deg,rgba(255,255,255,.025) 0 2px,transparent 2px 9px,rgba(0,0,0,.08) 9px 11px),
linear-gradient(180deg,#3a2a20,#1b120d 70%,#100a07)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55))}
.logo{font-size:12px;letter-spacing:.42em;color:var(--mut);text-transform:uppercase;font-family:system-ui,sans-serif}
h1{font-weight:400;letter-spacing:.22em;font-size:clamp(26px,5vw,44px);margin:6px 0 4px;text-transform:uppercase;text-shadow:0 2px 18px rgba(243,234,11,.25)}
p.s{margin:0;color:var(--mut);font:13px system-ui,sans-serif;letter-spacing:.08em}
.stage{perspective:1800px;max-width:1040px;margin:26px auto 0;padding:10px 0 40px;position:relative;z-index:1}
.scene{position:relative;display:flex;justify-content:center;align-items:flex-end;min-height:min(62vw,560px)}
.book{display:flex;position:relative;transform:rotateX(16deg) rotateZ(-1.5deg);transition:transform .5s;z-index:2}
.book::before{content:"";position:absolute;left:4%;right:4%;bottom:-26px;height:36px;background:radial-gradient(ellipse,rgba(0,0,0,.75),transparent 70%);filter:blur(8px);z-index:-1}
.pg{width:min(42vw,380px);aspect-ratio:148/210;background:#111 center/cover no-repeat;position:relative;animation:in .55s ease}
@keyframes in{from{opacity:0;transform:translateY(14px) rotateY(-10deg)}to{opacity:1;transform:none}}
.pg::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.2) 0%,transparent 32%,transparent 70%,rgba(255,255,255,.07));pointer-events:none}
.pg.l{border-radius:5px 0 0 5px;box-shadow:-3px 1px 0 #cfc7bb,-6px 2px 0 #b9b0a3,-9px 3px 0 #9d9487,-14px 8px 18px rgba(0,0,0,.5)}
.pg.r{border-radius:0 5px 5px 0;box-shadow:3px 1px 0 #cfc7bb,6px 2px 0 #b9b0a3,9px 3px 0 #9d9487,14px 8px 18px rgba(0,0,0,.5)}
.pg.l::after,.pg.r::after{content:"";position:absolute;top:0;bottom:0;width:16%;pointer-events:none}
.pg.l::after{right:0;background:linear-gradient(to left,rgba(0,0,0,.6),transparent)}
.pg.r::after{left:0;background:linear-gradient(to right,rgba(0,0,0,.6),transparent)}
.pg.solo{border-radius:5px;box-shadow:4px 2px 0 #cfc7bb,8px 3px 0 #9d9487,16px 14px 26px rgba(0,0,0,.6)}
.back{position:absolute;width:min(30vw,260px);aspect-ratio:148/210;background:#111 center/cover;border-radius:4px;left:calc(50% - min(62vw,560px));bottom:30px;transform:rotateZ(-9deg) rotateY(14deg);box-shadow:6px 3px 0 #b9b0a3,14px 16px 28px rgba(0,0,0,.65);opacity:.95;z-index:1}
.back::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.25),transparent 40%)}
.hide{display:none}
.glass{position:absolute;right:calc(50% - min(58vw,540px));bottom:20px;width:min(16vw,120px);z-index:3;filter:drop-shadow(0 12px 14px rgba(0,0,0,.6))}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 auto 24px;max-width:700px;position:relative;z-index:1}
.row button{font:13px system-ui,sans-serif;padding:9px 16px;border-radius:999px;border:1px solid var(--chipb);background:var(--chip);color:var(--tx);cursor:pointer;backdrop-filter:blur(6px);transition:.2s}
.row button:hover{border-color:var(--acc)}
.row button.on{background:var(--acc);color:#111;border-color:var(--acc);font-weight:700;box-shadow:0 0 18px rgba(243,234,11,.4)}
.th{display:grid;grid-template-columns:repeat(8,minmax(60px,1fr));gap:10px;max-width:860px;margin:0 auto;position:relative;z-index:1}
.th img{width:100%;aspect-ratio:148/210;object-fit:cover;border-radius:3px;box-shadow:0 8px 14px rgba(0,0,0,.55);cursor:pointer;transition:.25s;opacity:.75}
.th img:hover,.th img.on{opacity:1;transform:translateY(-5px)}
@media(max-width:640px){.th{grid-template-columns:repeat(4,1fr)}.back,.glass{display:none}.pg{width:44vw}}
</style></head><body>
