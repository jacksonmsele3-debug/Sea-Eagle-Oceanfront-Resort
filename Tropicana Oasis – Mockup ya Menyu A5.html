const book=document.getElementById('book'),row=document.getElementById('row'),th=document.getElementById('th');
function show(k){
 const p=S[k][1];book.className='book'+(p.length==1?' single':'');
 book.innerHTML=p.length==2
  ? '<div class="pg l" style="background-image:url('+I[p[0]]+')"></div><div class="pg r" style="background-image:url('+I[p[1]]+')"></div>'
  : '<div class="pg solo" style="background-image:url('+I[p[0]]+')"></div>';
 [...row.children].forEach((b,j)=>b.classList.toggle('on',j==k));
}

I.forEach((src,i)=>{const m=document.createElement('img');m.src=src;m.alt='Ukurasa '+(i+1);
 m.onclick=()=>show(S.findIndex(s=>s[1].includes(i)));th.appendChild(m)});
show(1);
</script></body></html>
